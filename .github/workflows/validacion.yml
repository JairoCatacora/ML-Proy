
name: Validacion Machine Learning

on:
  workflow_dispatch:
    inputs:
      ejecutar_modelo:
        description: 'Ejecutar entrenamiento y evaluacion con datos oficiales'
        type: boolean
        default: false
      filas_por_mes:
        description: 'Maximo de filas por mes (0 = todas)'
        type: choice
        options:
          - '10000'
          - '200000'
        default: '10000'
  push:
    branches:
      - 'feature/semanas-15-16'

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v

    
      - name: Entrenar y evaluar modelo
        run: |
          python -m src.reproduce --max-rows-per-month 200000

      - name: Guardar resultados
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-semanas-15-16
          path: |
            outputs/semana15_16/
            reports/figures/12_reproduccion_segmentos.png
          retention-days: 30

  
